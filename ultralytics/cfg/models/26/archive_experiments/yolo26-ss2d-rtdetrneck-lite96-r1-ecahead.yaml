# YOLO26n with SS2D backbone + RT-DETR neck + ECA-enhanced head.
# Same as yolo26-ss2d-rtdetrneck-lite96-r1.yaml but replaces Detect with DetectECA
# which adds Efficient Channel Attention in cls/reg branches.

nc: 80
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2SS2D, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2SS2D, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2SS2D, [512, True]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2SS2D, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 2, C2PSA, [1024]] # 10-P5/32

head:
  - [-1, 1, Conv, [384, 1, 1, None, 1, 1, False]] # 11 input_proj P5
  - [-1, 1, AIFI, [384, 8]] # 12
  - [-1, 1, Conv, [384, 1, 1]] # 13 Y5

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [6, 1, Conv, [384, 1, 1, None, 1, 1, False]] # 15 input_proj P4
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 2, RepC3, [384]] # 17 Y4
  - [-1, 1, Conv, [384, 1, 1]] # 18

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [4, 1, Conv, [384, 1, 1, None, 1, 1, False]] # 20 input_proj P3
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 2, RepC3, [384]] # 22 F3/P3

  - [-1, 1, Conv, [384, 3, 2]]
  - [[-1, 18], 1, Concat, [1]]
  - [-1, 2, RepC3, [384]] # 25 F4/P4

  - [-1, 1, Conv, [384, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, RepC3, [384]] # 28 F5/P5

  - [[22, 25, 28], 1, DetectECA, [nc]]
