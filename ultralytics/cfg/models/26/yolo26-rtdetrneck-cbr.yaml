# YOLO26n with an RT-DETR-style hybrid encoder neck and training-only CBRDetect supervision.
# This keeps the validated AIFI + RepC3 bidirectional fusion topology and replaces only
# the final Detect head with CBRDetect for classroom behavior auxiliary supervision.

nc: 80
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 2, C2PSA, [1024]] # 10-P5/32

head:
  # P5 global context branch, following RT-DETR hybrid encoder.
  - [-1, 1, Conv, [1024, 1, 1, None, 1, 1, False]] # 11 input_proj P5 -> 256 for n
  - [-1, 1, AIFI, [1024, 8]] # 12
  - [-1, 1, Conv, [1024, 1, 1]] # 13 Y5

  # Top-down fusion: P5 -> P4.
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [6, 1, Conv, [1024, 1, 1, None, 1, 1, False]] # 15 input_proj P4 -> 256 for n
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, RepC3, [1024]] # 17 Y4
  - [-1, 1, Conv, [1024, 1, 1]] # 18

  # Top-down fusion: P4 -> P3.
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [4, 1, Conv, [1024, 1, 1, None, 1, 1, False]] # 20 input_proj P3 -> 256 for n
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, RepC3, [1024]] # 22 F3/P3

  # Bottom-up fusion: P3 -> P4.
  - [-1, 1, Conv, [1024, 3, 2]]
  - [[-1, 18], 1, Concat, [1]]
  - [-1, 3, RepC3, [1024]] # 25 F4/P4

  # Bottom-up fusion: P4 -> P5.
  - [-1, 1, Conv, [1024, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 3, RepC3, [1024]] # 28 F5/P5

  - [[22, 25, 28], 1, CBRDetect, [nc]]
