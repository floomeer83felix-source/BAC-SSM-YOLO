# YOLO26-SCBSS2D-SCBNeckCA
# Head-only attention ablation:
# - Keep the SS2D-enhanced backbone unchanged.
# - Apply C3k2SCBNeckCAPlus at the P3 neck fusion stage.

nc: 80
end2end: True
reg_max: 1

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2SS2D, [256, True]] # 2-P2/4

  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2SS2D, [512, True]] # 4-P3/8

  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2SS2D, [512, True]] # 6-P4/16

  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2SS2D, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSASS2D, [1024]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2SCBConv, [512, True]] # 13 P4 fusion + CA

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2SCBNeckCAPlus, [256, True]] # 16 P3 fusion + CA

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2SS2D, [512, True]] # 19 P4 bottom-up fusion + CA

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 1, C3k2SCBConv, [1024, True, 0.5]] # 22 P5 fusion + CA

  - [[16, 19, 22], 1, Detect, [nc]]
