# Classroom detection dataset for classroom behavior analysis
# Update 'path' to your actual dataset root before training.
# Example usage:
#   yolo train model=ultralytics/cfg/models/26/yolo26.yaml data=ultralytics/cfg/datasets/classroom_det.yaml

# Train/val/test can be directories, txt files, or lists of paths.
path: E:/yolo/datasets/classroom_det
train: images/train
val: images/val
test: images/test

# Detection classes used by the front-end perception stage.
names:
  0: student
  1: teacher
  2: phone
  3: book

# Notes
# 1. Split train/val/test by video, classroom, or camera view instead of random frames.
# 2. Use this dataset only for object detection.
# 3. Keep behavior labels in a separate file aligned by frame or track ID.
