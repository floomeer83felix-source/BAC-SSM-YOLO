# Paper-faithful PLA-YOLO11n reimplementation for SCB-Dataset2.
# Not official author code. See the experiment README for assumptions.
nc: 3
end2end: false
reg_max: 16
scale: n

scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2PConv, [256, false, 0.25, 4]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2PConv, [512, false, 0.25, 4]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2PConv, [512, true, 0.50, 4]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2PConv, [1024, true, 0.50, 4]]
  - [-1, 1, AIFI, [2048, 8]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2PConv, [512, false, 0.50, 4]]
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2PConv, [256, false, 0.50, 4]]
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 2, C3k2PConv, [128, false, 0.50, 4]]
  - [-1, 1, LSKA, [7, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]
  - [-1, 2, C3k2PConv, [256, false, 0.50, 4]]
  - [-1, 1, LSKA, [7, 2]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2PConv, [512, false, 0.50, 4]]
  - [-1, 1, LSKA, [7, 2]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2PConv, [1024, true, 0.50, 4]]
  - [-1, 1, LSKA, [7, 2]]
  - [[20, 24, 28, 32], 1, Detect, [nc]]
