# Paper-faithful WAD-YOLOv8n reimplementation for SCB-Dataset2.
# Not official author code. See the experiment README for assumptions.
nc: 3
end2end: false
reg_max: 16
scale: n

scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2fWADCA, [128, true, 1, 0.5, 16]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2fWADCA, [256, true, 1, 0.5, 16]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2fWADCA, [512, true, 1, 0.5, 16]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2fWADCA, [1024, true, 1, 0.5, 16]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 1, TwoDPEMHA, [8, 0.0]]

head:
  - [-1, 1, DySample, [2, lp, 4, false]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, DySample, [2, lp, 4, false]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]
  - [[16, 19, 22], 1, Detect, [nc]]
